<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>快捷键设置</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #f5f5f7;
        --panel-strong: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: rgba(15, 23, 42, 0.08);
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --danger: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181c;
          --panel: #22242a;
          --panel-strong: #2a2d34;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --border: rgba(255, 255, 255, 0.08);
          --accent: #5eead4;
          --accent-soft: rgba(94, 234, 212, 0.12);
          --danger: #f87171;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
        background: radial-gradient(circle at top, var(--panel), var(--bg) 58%);
        color: var(--text);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        display: grid;
        gap: 14px;
      }

      .hint {
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }

      .shortcut-display {
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .shortcut-display.recording {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
        color: var(--accent);
      }

      .shortcut-display.has-value {
        color: var(--text);
      }

      .history-block {
        display: grid;
        gap: 8px;
      }

      .history-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .history-list {
        max-height: 150px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-strong);
      }

      .history-empty {
        padding: 16px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }

      .history-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }

      .history-item:last-child {
        border-bottom: none;
      }

      .history-value {
        flex: 1;
        font-size: 13px;
        line-height: 1.4;
        cursor: pointer;
      }

      .history-value:hover {
        color: var(--accent);
      }

      .history-delete {
        border: none;
        background: transparent;
        color: var(--danger);
        font-size: 12px;
        cursor: pointer;
      }

      .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-reset {
        margin-right: auto;
        background: var(--panel);
        color: var(--muted);
      }

      .btn-cancel {
        background: var(--panel);
        color: var(--text);
      }

      .btn-save {
        background: var(--accent);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="hint-text" class="hint">按下按键组合以设置快捷键</div>
      <div id="shortcut-display" class="shortcut-display">请录入...</div>

      <div class="history-block">
        <div id="history-label" class="history-title">最近使用</div>
        <div id="history-list" class="history-list"></div>
      </div>

      <div class="buttons">
        <button id="reset-btn" class="btn-reset">恢复默认</button>
        <button id="cancel-btn" class="btn-cancel">取消</button>
        <button id="save-btn" class="btn-save">保存</button>
      </div>
    </div>

    <script>
      async function getInvoke() {
        if (window.__TAURI__ && window.__TAURI__.core) {
          return window.__TAURI__.core.invoke
        }

        return new Promise((resolve) => {
          let attempts = 0
          const timer = setInterval(() => {
            attempts += 1
            if (window.__TAURI__ && window.__TAURI__.core) {
              clearInterval(timer)
              resolve(window.__TAURI__.core.invoke)
            } else if (attempts > 50) {
              clearInterval(timer)
              resolve(null)
            }
          }, 100)
        })
      }

      function readText(name, fallback) {
        return new URLSearchParams(window.location.search).get(name) || fallback
      }

      function formatShortcut(value) {
        return value
          .replaceAll('CommandOrControl', 'Cmd/Ctrl')
          .replaceAll('Alt', 'Option/Alt')
          .replaceAll('+', ' + ')
      }

      function normalizeKey(event) {
        const modifiers = []
        if (event.ctrlKey || event.metaKey) modifiers.push('CommandOrControl')
        if (event.altKey) modifiers.push('Alt')
        if (event.shiftKey) modifiers.push('Shift')

        const key = event.key
        const upper = key.toUpperCase()
        const modifierKeys = ['CONTROL', 'META', 'ALT', 'SHIFT']
        if (modifierKeys.includes(upper)) {
          return null
        }

        let finalKey = upper
        if (key === ' ') {
          finalKey = 'Space'
        }

        if (!modifiers.length) {
          return null
        }

        return `${modifiers.join('+')}+${finalKey}`
      }

      async function init() {
        const invoke = await getInvoke()
        if (!invoke) {
          alert('无法连接到程序核心服务，请稍后重试。')
          return
        }

        const display = document.getElementById('shortcut-display')
        const hintEl = document.getElementById('hint-text')
        const historyLabel = document.getElementById('history-label')
        const historyList = document.getElementById('history-list')
        const resetBtn = document.getElementById('reset-btn')
        const cancelBtn = document.getElementById('cancel-btn')
        const saveBtn = document.getElementById('save-btn')

        const emptyHistoryText = readText('emptyHistory', '暂无历史记录')
        const deleteText = readText('deleteText', '删除')

        hintEl.textContent = readText('hint', '按下按键组合以设置快捷键')
        historyLabel.textContent = readText('historyLabel', '最近使用')
        resetBtn.textContent = readText('resetText', '恢复默认')
        cancelBtn.textContent = readText('cancelText', '取消')
        saveBtn.textContent = readText('okText', '保存')

        const state = await invoke('get_shortcut_dialog_data')
        let currentShortcut = state.current || readText('current', '')
        const defaultShortcut = state.default_shortcut || 'CommandOrControl+G'
        let history = Array.isArray(state.history) ? [...state.history] : []

        const updateDisplay = (value, recording = false) => {
          display.classList.toggle('recording', recording)
          display.classList.toggle('has-value', Boolean(value))
          display.textContent = value ? formatShortcut(value) : '请录入...'
        }

        const renderHistory = () => {
          if (!history.length) {
            historyList.innerHTML = `<div class="history-empty">${emptyHistoryText}</div>`
            return
          }

          historyList.innerHTML = history
            .map(
              (item) => `
                <div class="history-item" data-shortcut="${encodeURIComponent(item)}">
                  <div class="history-value">${formatShortcut(item)}</div>
                  <button class="history-delete" type="button">${deleteText}</button>
                </div>
              `
            )
            .join('')

          historyList.querySelectorAll('.history-value').forEach((node) => {
            node.addEventListener('click', (event) => {
              const row = event.currentTarget.closest('.history-item')
              currentShortcut = decodeURIComponent(row.dataset.shortcut || '')
              updateDisplay(currentShortcut)
            })
          })

          historyList.querySelectorAll('.history-delete').forEach((node) => {
            node.addEventListener('click', async (event) => {
              const row = event.currentTarget.closest('.history-item')
              const value = decodeURIComponent(row.dataset.shortcut || '')
              await invoke('remove_shortcut_history', { shortcut: value })
              history = history.filter((item) => item !== value)
              renderHistory()
            })
          })
        }

        cancelBtn.onclick = () => invoke('close_shortcut_window').catch(console.error)

        resetBtn.onclick = () => {
          currentShortcut = defaultShortcut
          updateDisplay(currentShortcut)
        }

        saveBtn.onclick = async () => {
          try {
            await invoke('save_shortcut', { shortcut: currentShortcut })
            await invoke('close_shortcut_window')
          } catch (error) {
            alert(`保存失败：${error}`)
          }
        }

        window.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            cancelBtn.click()
            return
          }

          const nextShortcut = normalizeKey(event)
          if (!nextShortcut) {
            if (['Control', 'Meta', 'Alt', 'Shift'].includes(event.key)) {
              event.preventDefault()
              updateDisplay(currentShortcut, true)
            }
            return
          }

          event.preventDefault()
          currentShortcut = nextShortcut
          updateDisplay(currentShortcut)
        })

        updateDisplay(currentShortcut)
        renderHistory()
      }

      init()
    </script>
  </body>
</html>
